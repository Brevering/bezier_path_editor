<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bezier Path Editor</title>
  <script type="importmap">{"imports":{"gsap":"https://esm.sh/gsap@3.14.2","gsap/":"https://esm.sh/gsap@3.14.2/"}}</script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>Bezier Path Editor</h1>
    <p class="subtitle">Drag the handles to shape a cubic Bézier path, then preview it with GSAP.</p>
  </header>
  <section class="toolbar">
    <details class="control-group wide-group">
      <summary>Curve Generator</summary>
      <div class="control-group-body">
        <label>Curvature <input id="curvature" type="number" step="0.1" value="0.4" /></label>
        <label>Segments <input id="segments" type="number" min="1" max="5" value="1" /></label>
        <button id="generate" type="button">Generate</button>
      </div>
      <div class="control-group-body">
        <label for="pathInput">Path</label>
        <input id="pathInput" type="text" placeholder="M 79 117 C 250 50, 450 50, 625 175" />
        <button id="loadPath" type="button">Load Path</button>
        <span id="pathStatus" class="path-status" role="status" aria-live="polite"></span>
      </div>
    </details>
    <details class="control-group">
      <summary>Segment Tools</summary>
      <div class="control-group-body">
        <button id="lockEndpoints" type="button">Lock Endpoints: OFF</button>
        <button id="addSegment" type="button">+ Segment</button>
        <button id="snap" type="button">Snap: OFF</button>
      </div>
    </details>
    <details class="control-group">
      <summary>Endpoints</summary>
      <div class="control-group-body">
        <strong>Start:</strong>
        <label>X <input id="startX" type="number" value="79" /></label>
        <label>Y <input id="startY" type="number" value="117" /></label>
        <strong>End:</strong>
        <label>X <input id="endX" type="number" value="625" /></label>
        <label>Y <input id="endY" type="number" value="175" /></label>
        <button id="applyEndpoints" type="button">Apply</button>
        <button id="swapEndpoints" type="button">Swap Start/End</button>
      </div>
    </details>
    <details class="control-group wide-group">
      <summary>Background image</summary>
      <div class="control-group-body">
        <input id="backgroundUpload" type="file" accept="image/*" aria-label="Background image" />
        <button id="clearBackground" type="button" disabled>Clear</button>
        <button id="toggleBackground" type="button" disabled>Hide</button>
        <button id="toggleImageDragging" type="button" disabled>Move Image: OFF</button>
        <label for="backgroundOpacity">Opacity</label>
        <input id="backgroundOpacity" type="range" min="0" max="1" step="0.05" value="1" />
        <label for="backgroundMode">Mode</label>
        <select id="backgroundMode"><option value="fit">Fit</option><option value="cover">Cover</option></select>
        <label class="checkbox-label"><input id="scalePathOnUpload" type="checkbox" checked /> Scale path to image</label>
        <span id="backgroundStatus" role="status" aria-live="polite">No image selected</span>
      </div>
    </details>
  </section>
  <div class="canvas-layout">
    <aside class="points-panel">
      <div class="canvas-info" role="status" aria-live="polite">Canvas: <strong id="canvasSize">900 × 500 px</strong></div>
      <hr class="panel-divider" />
      <h2>Points</h2>
      <div id="pointsTableWrap">
        <table>
          <thead><tr><th></th><th>Type</th><th>X</th><th>Y</th></tr></thead>
          <tbody id="pointsTableBody"></tbody>
        </table>
      </div>
      <button id="deleteSelectedPoints" type="button" disabled>Delete Selected</button>
      <hr class="panel-divider" />
      <button id="preview" type="button">▶ Preview</button>
    </aside>
    <div class="stage">
      <svg id="svg" width="900" height="500" viewBox="0 0 900 500">
        <image id="backgroundImage" x="0" y="0" width="900" height="500" preserveAspectRatio="xMidYMid meet" visibility="hidden" pointer-events="all" />
        <path id="curve" fill="none" stroke="#ff5a5a" stroke-width="2" />
        <rect id="box" x="-12" y="-12" width="24" height="24" rx="6" fill="#ff5a5a" pointer-events="none" />
      </svg>
    </div>
  </div>
  <pre id="output"></pre>
  <script type="module" src="./script.js"></script>
</body>
</html>
